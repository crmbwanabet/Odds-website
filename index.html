<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OddsZone Zambia | Live Football Odds</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0D1B2A;
            --secondary: #1B263B;
            --accent: #E0A526;
            --accent-glow: rgba(224, 165, 38, 0.3);
            --success: #00C853;
            --text: #FFFFFF;
            --text-muted: #8892A0;
            --card-bg: #1B263B;
            --border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--primary);
            color: var(--text);
            min-height: 100vh;
            background-image:
                radial-gradient(ellipse at 20% 20%, rgba(224, 165, 38, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(26, 92, 255, 0.08) 0%, transparent 50%);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 40px 20px 30px;
            margin-bottom: 30px;
        }

        .logo {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 3.5rem;
            letter-spacing: 4px;
            margin-bottom: 8px;
            background: linear-gradient(135deg, var(--accent) 0%, #FFF 50%, var(--accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .tagline {
            color: var(--text-muted);
            font-size: 1rem;
            font-weight: 500;
        }

        .live-badge {
            display: inline-block;
            margin-top: 12px;
            padding: 6px 14px;
            border-radius: 20px;
            background: rgba(0, 200, 83, 0.12);
            border: 1px solid rgba(0, 200, 83, 0.4);
            color: var(--success);
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .live-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
            margin-right: 8px;
            animation: pulse 1.5s ease infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .search-section {
            max-width: 700px;
            margin: 0 auto 40px;
        }

        .search-container {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .search-input-wrapper {
            flex: 1;
            min-width: 280px;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 18px 24px 18px 54px;
            font-size: 1.1rem;
            font-family: 'DM Sans', sans-serif;
            border: 2px solid var(--border);
            border-radius: 16px;
            background: var(--secondary);
            color: var(--text);
            transition: all 0.3s ease;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 30px var(--accent-glow);
        }

        .search-input::placeholder {
            color: var(--text-muted);
        }

        .search-icon {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.3rem;
            opacity: 0.5;
        }

        .search-btn {
            padding: 18px 40px;
            font-size: 1.1rem;
            font-family: 'Bebas Neue', sans-serif;
            letter-spacing: 2px;
            border: none;
            border-radius: 16px;
            background: linear-gradient(135deg, var(--accent) 0%, #D4941C 100%);
            color: var(--primary);
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .search-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 40px var(--accent-glow);
        }

        .search-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .quick-filters {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .filter-chip {
            padding: 10px 20px;
            background: var(--secondary);
            border: 1px solid var(--border);
            border-radius: 30px;
            color: var(--text-muted);
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .filter-chip:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .filter-chip.featured-chip {
            border-color: var(--accent);
            color: var(--accent);
        }

        .loading {
            text-align: center;
            padding: 60px;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-status {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-top: 15px;
        }

        .results-section {
            margin-top: 30px;
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .results-count {
            font-size: 1.1rem;
            color: var(--text-muted);
        }

        .results-count span {
            color: var(--accent);
            font-weight: 700;
        }

        .results-updated {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .match-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 28px;
            margin-bottom: 24px;
            border: 1px solid var(--border);
            transition: all 0.3s ease;
            animation: fadeInUp 0.5s ease forwards;
        }

        .match-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .match-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .match-teams {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.8rem;
            letter-spacing: 1px;
        }

        .match-vs {
            color: var(--accent);
            margin: 0 12px;
            font-size: 1.4rem;
        }

        .match-meta {
            text-align: right;
        }

        .match-league {
            color: var(--accent);
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .match-time {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 4px;
        }

        .top-tag {
            display: inline-block;
            padding: 3px 10px;
            margin-left: 10px;
            border-radius: 12px;
            background: rgba(224, 165, 38, 0.15);
            border: 1px solid rgba(224, 165, 38, 0.4);
            color: var(--accent);
            font-family: 'DM Sans', sans-serif;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 1px;
            vertical-align: middle;
        }

        .odds-grid {
            display: grid;
            gap: 12px;
        }

        .bookmaker-row {
            display: grid;
            grid-template-columns: 200px repeat(3, 1fr) auto;
            gap: 12px;
            align-items: center;
            padding: 16px 20px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            transition: all 0.3s ease;
        }

        .bookmaker-row:hover {
            background: rgba(0, 0, 0, 0.3);
        }

        .bookmaker-row.featured {
            background: rgba(255, 255, 255, 0.05);
        }

        .bookmaker-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .bookmaker-logo {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-weight: 700;
            overflow: hidden;
            color: #000;
            flex-shrink: 0;
        }

        .bookmaker-logo img {
            width: 32px;
            height: 32px;
            object-fit: contain;
            border-radius: 4px;
        }

        .bookmaker-logo span {
            color: #000;
            font-weight: 700;
            font-size: 0.85rem;
        }

        .bookmaker-name {
            font-weight: 600;
            font-size: 1rem;
        }

        .odds-cell {
            text-align: center;
        }

        .odds-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .odds-value {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.6rem;
            color: var(--text);
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            display: inline-block;
            min-width: 70px;
            transition: all 0.2s ease;
        }

        .odds-value:hover {
            background: var(--accent);
            color: var(--primary);
        }

        .odds-value.best {
            background: rgba(224, 165, 38, 0.18);
            color: var(--accent);
        }

        .visit-btn {
            padding: 10px 20px;
            font-size: 0.85rem;
            font-family: 'DM Sans', sans-serif;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            background: var(--accent);
            color: var(--primary);
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            white-space: nowrap;
        }

        .visit-btn:hover {
            background: #FFF;
            transform: scale(1.05);
        }

        .empty-state {
            text-align: center;
            padding: 80px 20px;
        }

        .empty-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .empty-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 2rem;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .empty-text {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .error-state {
            text-align: center;
            padding: 40px;
            background: rgba(255, 71, 87, 0.1);
            border: 1px solid rgba(255, 71, 87, 0.3);
            border-radius: 16px;
            margin: 20px 0;
        }

        .error-text {
            color: #FF4757;
            font-size: 1rem;
        }

        footer {
            text-align: center;
            padding: 40px 20px;
            margin-top: 60px;
            border-top: 1px solid var(--border);
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        @media (max-width: 900px) {
            .bookmaker-row {
                grid-template-columns: 1fr;
                gap: 16px;
                text-align: center;
            }
            .bookmaker-info {
                justify-content: center;
                flex-wrap: wrap;
            }
            .odds-cell {
                display: inline-block;
                margin: 0 8px;
            }
            .match-meta {
                text-align: left;
            }
            .visit-btn {
                width: 100%;
                padding: 14px 20px;
            }
        }

        .comparison {
            margin-top: 16px;
        }

        .compare-toggle {
            width: 100%;
            padding: 12px 20px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px dashed var(--border);
            border-radius: 12px;
            color: var(--text-muted);
            font-family: 'DM Sans', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .compare-toggle:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(224, 165, 38, 0.06);
        }

        .compare-toggle.open {
            color: var(--accent);
            border-style: solid;
            border-color: rgba(224, 165, 38, 0.3);
        }

        .compare-toggle .chev {
            font-size: 0.8rem;
        }

        .best-badge {
            padding: 3px 10px;
            border-radius: 12px;
            background: rgba(0, 200, 83, 0.15);
            border: 1px solid rgba(0, 200, 83, 0.4);
            color: var(--success);
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .comparison-rows {
            display: grid;
            gap: 12px;
            margin-top: 12px;
        }

        .comparison-rows .bookmaker-row {
            animation: fadeInUp 0.35s ease forwards;
        }

        .compare-loading {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 20px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .spinner.small {
            width: 22px;
            height: 22px;
            border-width: 2px;
            margin: 0;
        }

        .compare-empty {
            text-align: center;
            padding: 16px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            .logo {
                font-size: 2.5rem;
            }
            .match-teams {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1 class="logo">ODDSZONE ZAMBIA</h1>
            <p class="tagline">Live Football Odds &amp; Fixtures</p>
            <div class="live-badge"><span class="live-dot"></span>LIVE ODDS</div>
        </header>

        <section class="search-section">
            <div class="search-container">
                <div class="search-input-wrapper">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="searchInput" class="search-input" placeholder="Search team or match (e.g., Arsenal vs Chelsea)">
                </div>
                <button id="searchBtn" class="search-btn">SEARCH</button>
            </div>
            <div class="quick-filters" id="quickFilters">
                <span class="filter-chip featured-chip" id="topMatchesChip">🔥 Top Matches</span>
            </div>
        </section>

        <section id="resultsSection" class="results-section">
            <div class="empty-state">
                <div class="empty-icon">⚽</div>
                <h2 class="empty-title">LOADING TOP MATCHES…</h2>
                <p class="empty-text">Or search a team to find its next fixtures</p>
            </div>
        </section>

        <footer>
            <p>Odds are provided live by the listed bookmakers and may change at any time. 18+ only. Bet responsibly — gambling can be addictive.</p>
        </footer>
    </div>

    <script>
        // ============================================
        // CONFIGURATION
        // ============================================

        const CONFIG = {
            // BwanaBet's Altenar sportsbook feed (public GraphQL-over-multi endpoint,
            // CORS-open, no auth). Same feed the bwanabet.co.zm site itself uses.
            ALTENAR_API: 'https://api.bwanabet.co.zm/api/v2/multi',
            SPORT_FOOTBALL: 501,
            REQUEST_TIMEOUT_MS: 10000,
            FEED_CACHE_TTL_MS: 60 * 1000,   // re-fetch feed pages after 60s so odds stay fresh
            SEARCH_MAX_PAGES: 6,
            PAGE_LIMIT: 100,
            MAX_RESULTS: 8,

            // Competitor-odds proxy (Cloudflare Worker in /worker). Competitor feeds
            // are CORS-locked, so the proxy fetches them server-side and re-serves
            // with CORS. For local testing point this at the dev-server
            // (http://localhost:8787).
            PROXY_URL: 'https://oddszone-odds-proxy.oddszone.workers.dev',
            PROXY_CACHE_TTL_MS: 45 * 1000
        };

        // Bookmaker display metadata. BwanaBet is always first and featured; the
        // rest are shown only when the proxy actually has that bookmaker's real odds
        // for the fixture. `key` matches the proxy's per-book field name.
        const BWANABET = {
            key: 'bwanabet',
            name: 'BwanaBet',
            color: '#FFD700',
            logo: 'https://www.google.com/s2/favicons?domain=bwanabet.co.zm&sz=64',
            logoText: 'BW',
            url: 'https://bwanabet.co.zm/'
        };

        const COMPETITORS = [
            { key: 'sportybet', name: 'SportyBet', color: '#E31E24', logo: 'https://www.google.com/s2/favicons?domain=sportybet.com&sz=64', logoText: 'SB', url: 'https://www.sportybet.com/zm/' },
            { key: 'onexbet', name: '1xBet', color: '#1A5CFF', logo: 'https://www.google.com/s2/favicons?domain=1xbet.com.zm&sz=64', logoText: '1X', url: 'https://1xbet.com.zm/' },
            { key: 'betway', name: 'Betway', color: '#00A651', logo: 'https://www.google.com/s2/favicons?domain=betway.co.zm&sz=64', logoText: 'BW', url: 'https://www.betway.co.zm/' },
            { key: 'betpawa', name: 'BetPawa', color: '#9CE800', logo: 'https://www.google.com/s2/favicons?domain=betpawa.co.zm&sz=64', logoText: 'BP', url: 'https://www.betpawa.co.zm/' },
            { key: 'bolabet', name: 'BolaBet', color: '#F5A623', logo: 'https://www.google.com/s2/favicons?domain=bolabet.co.zm&sz=64', logoText: 'BL', url: 'https://www.bolabet.co.zm/' }
        ];

        // ============================================
        // DOM ELEMENTS
        // ============================================

        const $ = id => document.getElementById(id);
        const elements = {
            searchInput: $('searchInput'),
            searchBtn: $('searchBtn'),
            resultsSection: $('resultsSection')
        };

        // ============================================
        // ALTENAR CLIENT (browser port of the bot's lib/altenar-client.js)
        // ============================================

        async function multiQuery(query) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), CONFIG.REQUEST_TIMEOUT_MS);
            try {
                const res = await fetch(CONFIG.ALTENAR_API, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify([{ module: 'graphs', method: 'makeQuery', options: { query } }]),
                    signal: controller.signal
                });
                if (!res.ok) throw new Error(`API error ${res.status}`);
                const data = await res.json();
                if (!Array.isArray(data) || !data[0]) throw new Error('Unexpected response shape');
                if (data[0].error) throw new Error(data[0].message || 'Query failed');
                return data[0].data;
            } catch (err) {
                if (err && err.name === 'AbortError') {
                    throw new Error('BwanaBet feed timed out');
                }
                throw err;
            } finally {
                clearTimeout(timer);
            }
        }

        // Feed pages are cached briefly so repeated searches don't hammer the API,
        // but expire fast enough that displayed odds track the live book.
        const feedPageCache = new Map(); // page -> { at, events }

        async function getMainEvents(page) {
            const cached = feedPageCache.get(page);
            if (cached && Date.now() - cached.at < CONFIG.FEED_CACHE_TTL_MS) {
                return cached.events;
            }
            const query = `mutation {
                mainEventList(mainEventListInput: {
                    topEvents: false
                    page: ${page}
                    sportId: ${CONFIG.SPORT_FOOTBALL}
                    limit: ${CONFIG.PAGE_LIMIT}
                }) {
                    sportName
                    pageCount
                    competitions {
                        competitionId
                        country
                        competitionName
                        events {
                            eventId
                            eventName
                            eventStartTime
                            top
                            pricesCount
                        }
                    }
                }
            }`;
            const data = await multiQuery(query);
            const sport = data.mainEventList && data.mainEventList[0];
            const events = [];
            if (sport) {
                for (const comp of sport.competitions || []) {
                    for (const e of comp.events || []) {
                        events.push({
                            eventId: e.eventId,
                            eventName: e.eventName,
                            eventStartTime: e.eventStartTime,
                            top: e.top === true,
                            competitionName: comp.competitionName,
                            country: comp.country,
                            // The feed returns full market collections inline even though
                            // the query doesn't ask for them — use them when present so we
                            // don't need a second request per event.
                            collections: e.collections || null
                        });
                    }
                }
            }
            feedPageCache.set(page, { at: Date.now(), events });
            return events;
        }

        // Fallback for events whose feed entry came without inline collections.
        async function getEventCollections(eventId) {
            const query = `mutation {
                eventList(eventListInput: { eventId: ${Number(eventId)} }) {
                    sportId
                    competitions {
                        competitionId
                        country
                        competitionName
                        events {
                            eventId
                            eventName
                            eventStartTime
                            collections {
                                collectionId
                                collectionName
                                markets {
                                    marketId
                                    marketName
                                    marketCode
                                    prices {
                                        referenceId
                                        priceName
                                        handicapValue
                                        rate
                                        blocked
                                    }
                                }
                            }
                        }
                    }
                }
            }`;
            const data = await multiQuery(query);
            const event = data.eventList?.[0]?.competitions?.[0]?.events?.[0];
            return event ? event.collections : null;
        }

        // Extract the 1X2 (Match Result) prices from an event's market collections.
        // Blocked or zero-rate prices render as '-'.
        function extract1x2(collections) {
            if (!collections) return null;
            const main = collections.find(c => c.collectionName === 'Main');
            if (!main) return null;
            const market = (main.markets || []).find(m => m.marketCode === '1x2');
            if (!market) return null;
            const odds = { home: '-', draw: '-', away: '-' };
            for (const p of market.prices || []) {
                if (p.blocked || !(p.rate > 0)) continue;
                if (p.priceName === '1') odds.home = p.rate.toFixed(2);
                else if (p.priceName === 'X') odds.draw = p.rate.toFixed(2);
                else if (p.priceName === '2') odds.away = p.rate.toFixed(2);
            }
            return odds;
        }

        function splitTeams(eventName) {
            const parts = String(eventName).split(/\s+vs?\.?\s+/i);
            if (parts.length >= 2) {
                return { home: parts[0].trim(), away: parts.slice(1).join(' v ').trim() };
            }
            return { home: eventName, away: '' };
        }

        // Altenar has no team-search endpoint — scan the priority-sorted paginated
        // feed and match on event name (same approach as the bot's findEventByTeams).
        async function findEventsByTeams(rawQuery) {
            const raw = String(rawQuery || '').toLowerCase().trim();
            if (!raw) return [];
            const parts = raw.split(/\s+(?:vs?\.?|-)\s+/).map(s => s.trim()).filter(Boolean);
            const tokens = parts.length >= 2 ? parts.slice(0, 2) : [raw];
            const enough = tokens.length >= 2 ? 2 : CONFIG.MAX_RESULTS;

            const matches = [];
            const seen = new Set();
            for (let page = 1; page <= CONFIG.SEARCH_MAX_PAGES; page++) {
                let events;
                try { events = await getMainEvents(page); }
                catch (e) { break; }
                if (events.length === 0) break;
                for (const e of events) {
                    const name = String(e.eventName).toLowerCase();
                    const hit = tokens.length >= 2
                        ? tokens.every(t => name.includes(t))
                        : name.includes(tokens[0]);
                    if (hit && !seen.has(e.eventId)) {
                        seen.add(e.eventId);
                        matches.push(e);
                    }
                }
                if (matches.length >= enough) break;
            }
            return matches.sort((a, b) =>
                new Date(a.eventStartTime).getTime() - new Date(b.eventStartTime).getTime()
            ).slice(0, CONFIG.MAX_RESULTS);
        }

        // Operator-curated marquee matches (top === true in the feed), soonest first.
        async function getTopEvents() {
            const top = [];
            const seen = new Set();
            for (let page = 1; page <= 4; page++) {
                let events;
                try { events = await getMainEvents(page); }
                catch (e) { break; }
                if (events.length === 0) break;
                for (const e of events) {
                    if (e.top && !seen.has(e.eventId)) {
                        seen.add(e.eventId);
                        top.push(e);
                    }
                }
                if (top.length >= CONFIG.MAX_RESULTS) break;
            }
            return top.sort((a, b) =>
                new Date(a.eventStartTime).getTime() - new Date(b.eventStartTime).getTime()
            ).slice(0, CONFIG.MAX_RESULTS);
        }

        // ============================================
        // COMPETITOR ODDS (via proxy) + TEAM MATCHING
        // ============================================

        // Cached proxy response: { at, index } where index maps competitor key ->
        // array of { home, away, norm:{home,away}, odds }.
        let competitorCache = { at: 0, index: null };

        async function getCompetitorIndex() {
            if (competitorCache.index && Date.now() - competitorCache.at < CONFIG.PROXY_CACHE_TTL_MS) {
                return competitorCache.index;
            }
            const index = {};
            try {
                const controller = new AbortController();
                const timer = setTimeout(() => controller.abort(), CONFIG.REQUEST_TIMEOUT_MS);
                const res = await fetch(`${CONFIG.PROXY_URL}/odds`, { signal: controller.signal });
                clearTimeout(timer);
                if (res.ok) {
                    const data = await res.json();
                    for (const [book, events] of Object.entries(data.books || {})) {
                        index[book] = (events || []).map(e => ({
                            home: e.home, away: e.away,
                            norm: { home: normTeam(e.home), away: normTeam(e.away) },
                            odds: e.odds
                        }));
                    }
                }
            } catch (e) {
                console.warn('Competitor proxy unavailable:', e.message);
            }
            competitorCache = { at: Date.now(), index };
            return index;
        }

        // Normalize a team name to a token set for fuzzy fixture matching across
        // bookmakers that spell teams differently ("FC Ararat-Armenia" vs
        // "Ararat Armenia", "Man Utd" vs "Manchester United").
        const TEAM_STOPWORDS = new Set(['fc', 'afc', 'cf', 'sc', 'ac', 'if', 'sk', 'fk', 'bk', 'club',
            'city', 'town', 'united', 'utd', 'the', 'de', 'do', 'da', 'e', 'u21', 'u20', 'u23', 'u19',
            'women', 'reserves', 'ii', 'b']);
        const TEAM_ALIAS = { man: 'manchester', utd: 'united', psg: 'paris', inter: 'internazionale' };

        function normTeam(name) {
            const raw = String(name || '').toLowerCase()
                .normalize('NFD').replace(/[̀-ͯ]/g, '')  // strip accents
                .replace(/[^a-z0-9\s]/g, ' ');
            const tokens = raw.split(/\s+/).filter(Boolean)
                .map(t => TEAM_ALIAS[t] || t)
                .filter(t => !TEAM_STOPWORDS.has(t) && t.length > 1);
            return new Set(tokens);
        }

        function tokenOverlap(a, b) {
            if (!a.size || !b.size) return 0;
            let hit = 0;
            for (const t of a) if (b.has(t)) hit++;
            return hit / Math.min(a.size, b.size);
        }

        // Does a competitor event refer to the same fixture as the BwanaBet card?
        // Require a strong match on BOTH sides (and allow home/away to be swapped,
        // since books order teams inconsistently).
        function isSameFixture(cardNorm, ev) {
            const straight = Math.min(tokenOverlap(cardNorm.home, ev.norm.home), tokenOverlap(cardNorm.away, ev.norm.away));
            const swapped = Math.min(tokenOverlap(cardNorm.home, ev.norm.away), tokenOverlap(cardNorm.away, ev.norm.home));
            return { score: Math.max(straight, swapped), swapped: swapped > straight };
        }

        // For one BwanaBet card, find each competitor's real odds for the same fixture.
        // Returns [{ book, odds }] for competitors that genuinely have the match.
        function matchCompetitors(card, index) {
            const cardNorm = { home: normTeam(card.homeTeam), away: normTeam(card.awayTeam) };
            const rows = [];
            for (const comp of COMPETITORS) {
                const events = index[comp.key] || [];
                let best = null;
                for (const ev of events) {
                    const m = isSameFixture(cardNorm, ev);
                    if (m.score >= 0.7 && (!best || m.score > best.score)) {
                        // If teams were swapped relative to our card, swap home/away odds too.
                        const odds = m.swapped
                            ? { home: ev.odds.away, draw: ev.odds.draw, away: ev.odds.home }
                            : ev.odds;
                        best = { score: m.score, odds };
                    }
                }
                if (best) rows.push({ book: comp, odds: best.odds });
            }
            return rows;
        }

        // ============================================
        // SEARCH & RESULTS
        // ============================================

        async function buildMatchCards(feedEvents) {
            const cards = [];
            for (const e of feedEvents) {
                let odds = extract1x2(e.collections);
                if (!odds) {
                    try { odds = extract1x2(await getEventCollections(e.eventId)); }
                    catch (err) { odds = null; }
                }
                if (!odds) continue; // no 1X2 market — nothing to show
                const teams = splitTeams(e.eventName);
                cards.push({
                    homeTeam: teams.home,
                    awayTeam: teams.away || 'TBA',
                    league: e.country ? `${e.country} · ${e.competitionName}` : e.competitionName,
                    time: formatDate(e.eventStartTime),
                    top: e.top,
                    odds
                });
            }
            return cards;
        }

        async function handleSearch() {
            const searchTerm = elements.searchInput.value.trim();
            if (!searchTerm) {
                elements.searchInput.focus();
                return;
            }
            elements.searchBtn.disabled = true;
            renderLoading('Scanning the live odds feed…');
            try {
                const events = await findEventsByTeams(searchTerm);
                if (events.length === 0) {
                    renderNoMatches(searchTerm);
                    return;
                }
                const cards = await buildMatchCards(events);
                if (cards.length === 0) {
                    renderNoMatches(searchTerm);
                    return;
                }
                renderResults(cards, `Found <span>${cards.length}</span> match${cards.length > 1 ? 'es' : ''}`);
            } catch (error) {
                console.error('Search error:', error);
                renderError('Could not reach the live odds feed. Check your connection and try again.');
            } finally {
                elements.searchBtn.disabled = false;
            }
        }

        async function showTopMatches() {
            renderLoading('Loading top matches…');
            try {
                let events = await getTopEvents();
                // Off-season or quiet days can leave the curated "top" list empty —
                // fall back to the soonest events on the feed so the page always has
                // real, searchable content.
                let heading;
                if (events.length > 0) {
                    heading = n => `<span>${n}</span> top match${n > 1 ? 'es' : ''} right now`;
                } else {
                    events = (await getMainEvents(1))
                        .slice()
                        .sort((a, b) => new Date(a.eventStartTime).getTime() - new Date(b.eventStartTime).getTime())
                        .slice(0, CONFIG.MAX_RESULTS);
                    heading = n => `<span>${n}</span> upcoming match${n > 1 ? 'es' : ''}`;
                }
                const cards = await buildMatchCards(events);
                if (cards.length === 0) {
                    renderNoMatches('upcoming matches');
                    return;
                }
                updateQuickChips(cards);
                renderResults(cards, heading(cards.length));
            } catch (error) {
                console.error('Top matches error:', error);
                renderError('Could not reach the live odds feed. Check your connection and try again.');
            }
        }

        // Rebuild the quick-search chips from teams that are actually on the feed
        // right now, so every chip is guaranteed to return a result when clicked.
        function updateQuickChips(cards) {
            const names = [];
            const seen = new Set();
            for (const card of cards) {
                for (const team of [card.homeTeam, card.awayTeam]) {
                    const name = String(team).trim();
                    const key = name.toLowerCase();
                    if (name && name !== 'TBA' && !seen.has(key)) {
                        seen.add(key);
                        names.push(name);
                    }
                    if (names.length >= 6) break;
                }
                if (names.length >= 6) break;
            }
            if (names.length === 0) return;
            $('quickFilters').innerHTML =
                '<span class="filter-chip featured-chip" id="topMatchesChip">🔥 Top Matches</span>' +
                names.map(n => `<span class="filter-chip" data-team="${escapeHtml(n)}">${escapeHtml(n)}</span>`).join('');
            bindChips();
        }

        function formatDate(dateStr) {
            const d = new Date(dateStr);
            if (isNaN(d.getTime())) return 'Upcoming';
            return d.toLocaleDateString('en-GB', {
                weekday: 'short', month: 'short', day: 'numeric',
                hour: '2-digit', minute: '2-digit'
            });
        }

        // ============================================
        // RENDERING
        // ============================================

        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }

        function renderLoading(message) {
            elements.resultsSection.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>${escapeHtml(message || 'Finding the best odds…')}</p>
                </div>
            `;
        }

        function renderError(message) {
            elements.resultsSection.innerHTML = `
                <div class="error-state">
                    <p class="error-text">⚠️ ${escapeHtml(message)}</p>
                </div>
            `;
        }

        function renderNoMatches(searchTerm) {
            elements.resultsSection.innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">🔍</div>
                    <h2 class="empty-title">NO MATCHES FOUND</h2>
                    <p class="empty-text">No upcoming fixtures on the feed for "${escapeHtml(searchTerm)}"</p>
                    <div style="margin-top: 20px; text-align: left; max-width: 400px; margin-left: auto; margin-right: auto;">
                        <p class="empty-text" style="font-size: 0.9rem; margin-bottom: 10px;">💡 <strong>Tips:</strong></p>
                        <p class="empty-text" style="font-size: 0.85rem;">• Try both teams: <strong>"Arsenal vs Chelsea"</strong></p>
                        <p class="empty-text" style="font-size: 0.85rem;">• Check spelling of the team name</p>
                        <p class="empty-text" style="font-size: 0.85rem;">• The team's next match may not be listed yet</p>
                    </div>
                </div>
            `;
        }

        // Cards currently on screen, so the compare toggle can resolve a card by index.
        let currentCards = [];

        function renderResults(cards, headerHtml) {
            currentCards = cards;
            const updated = new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
            let html = `<div class="results-header">
                <p class="results-count">${headerHtml}</p>
                <p class="results-updated">Odds updated ${updated}</p>
            </div>`;

            cards.forEach((card, i) => {
                html += `
                    <div class="match-card" style="animation-delay: ${i * 0.1}s" data-card="${i}">
                        <div class="match-header">
                            <div class="match-teams">
                                ${escapeHtml(card.homeTeam)}
                                <span class="match-vs">VS</span>
                                ${escapeHtml(card.awayTeam)}
                                ${card.top ? '<span class="top-tag">TOP</span>' : ''}
                            </div>
                            <div class="match-meta">
                                <div class="match-league">${escapeHtml(card.league)}</div>
                                <div class="match-time">${escapeHtml(card.time)}</div>
                            </div>
                        </div>
                        <div class="odds-grid">
                            ${renderRow(BWANABET, card.odds, null)}
                        </div>
                        <div class="comparison" data-comparison="${i}"></div>
                    </div>
                `;
            });

            elements.resultsSection.innerHTML = html;
            // Progressively reveal a comparison ONLY on fixtures where BwanaBet has
            // the best price on all three outcomes (site policy). Fetches competitor
            // odds once; fast initial render is unaffected.
            revealComparisons(cards);
        }

        // Fetch real competitor odds, and for each card decide whether BwanaBet wins
        // every column. If so, reveal a "Compare" toggle with the real side-by-side
        // rows (BwanaBet best on all). If a competitor is cheaper on any outcome — or
        // no competitor has the fixture — no comparison is shown for that match.
        async function revealComparisons(cards) {
            let index;
            try { index = await getCompetitorIndex(); }
            catch (e) { return; }

            cards.forEach((card, i) => {
                const rows = matchCompetitors(card, index);
                if (rows.length === 0) return; // nothing to compare against

                const best = {};
                for (const k of ['home', 'draw', 'away']) {
                    best[k] = Math.max(parseFloat(card.odds[k]),
                        ...rows.map(r => parseFloat(r.odds[k])).filter(n => !isNaN(n)));
                }
                const bwanaWins = ['home', 'draw', 'away'].every(k =>
                    parseFloat(card.odds[k]) >= best[k] - 1e-9);
                if (!bwanaWins) return; // policy: only surface where BwanaBet is best

                // BwanaBet is best on every column — highlight its row, reveal compare.
                const grid = document.querySelector(`[data-card="${i}"] .odds-grid`);
                if (grid) grid.innerHTML = renderRow(BWANABET, card.odds, best);

                const container = document.querySelector(`[data-comparison="${i}"]`);
                if (!container) return;
                container.innerHTML = `
                    <button class="compare-toggle" data-toggle="${i}">
                        <span class="chev">▾</span> Compare other bookmakers
                        <span class="best-badge">✓ BwanaBet best price</span>
                    </button>
                    <div class="comparison-rows" data-rows="${i}" hidden>
                        ${rows.map(r => renderRow(r.book, r.odds, best)).join('')}
                    </div>`;
                container.querySelector('.compare-toggle')
                    .addEventListener('click', () => toggleComparison(i));
            });
        }

        // Render one bookmaker's row. `best` (optional) = {home,draw,away} numeric
        // maxima across all shown books; a cell equal to the max is highlighted.
        function renderRow(book, odds, best) {
            const cell = (label, key) => {
                const v = odds[key];
                const isBest = best && v != null && Math.abs(parseFloat(v) - best[key]) < 1e-9;
                return `
                    <div class="odds-cell">
                        <div class="odds-label">${label}</div>
                        <span class="odds-value ${isBest ? 'best' : ''}">${v == null ? '–' : v}</span>
                    </div>`;
            };
            return `
                <div class="bookmaker-row ${book.key === 'bwanabet' ? 'featured' : ''}">
                    <div class="bookmaker-info">
                        <div class="bookmaker-logo" style="background: ${book.color};">
                            <img src="${book.logo}" alt="${escapeHtml(book.name)}" onerror="this.style.display='none'; this.parentElement.innerHTML='<span>${book.logoText}</span>';">
                        </div>
                        <span class="bookmaker-name">${escapeHtml(book.name)}</span>
                    </div>
                    ${cell('1 · Home', 'home')}
                    ${cell('X · Draw', 'draw')}
                    ${cell('2 · Away', 'away')}
                    <a href="${book.url}" target="_blank" rel="noopener" class="visit-btn">Bet Now</a>
                </div>
            `;
        }

        // Expand/collapse a card's comparison. Rows are already rendered (competitor
        // odds were fetched during revealComparisons), so this is pure show/hide.
        function toggleComparison(i) {
            const rowsEl = document.querySelector(`[data-rows="${i}"]`);
            const btn = document.querySelector(`[data-toggle="${i}"]`);
            if (!rowsEl || !btn) return;
            const opening = rowsEl.hidden;
            rowsEl.hidden = !opening;
            btn.classList.toggle('open', opening);
            btn.querySelector('.chev').textContent = opening ? '▴' : '▾';
        }

        // ============================================
        // EVENT LISTENERS
        // ============================================

        elements.searchBtn.addEventListener('click', handleSearch);
        elements.searchInput.addEventListener('keypress', e => {
            if (e.key === 'Enter') handleSearch();
        });

        function bindChips() {
            document.querySelectorAll('.filter-chip[data-team]').forEach(chip => {
                chip.addEventListener('click', () => {
                    elements.searchInput.value = chip.dataset.team;
                    handleSearch();
                });
            });
            $('topMatchesChip').addEventListener('click', showTopMatches);
        }
        bindChips();

        // Open with real content: today's operator-curated top matches.
        showTopMatches();
    </script>
</body>
</html>
