        @media (max-width: 900px) {
            .bookmaker-row {

            .logo {

            .match-teams {

        }

    <script>
        // ============================================

        const CONFIG = {

            // Supabase Edge Function for Claude AI odds
            USE_CLAUDE_PROXY: true,
            CLAUDE_PROXY_URL: 'https://dumjacmxefrxzcccsyxj.supabase.co/functions/v1/claude-proxy'
        };

        // Zambian Betting Companies - BwanaBet ALWAYS first
        const BETTING_COMPANIES = [

            {

            },
            { 
                id: 'castlebet', 
                name: 'CastleBet', 
                color: '#8B0000', 
                logo: 'https://www.google.com/s2/favicons?domain=castlebet.co.zm&sz=64',
                logoText: 'CB',
                featured: false, 
                apiKey: null,

            },
            { 
                id: 'bolabet', 
                name: 'BolaBet', 
                color: '#9B59B6', 
                logo: 'https://www.google.com/s2/favicons?domain=bolabet.co.zm&sz=64',
                logoText: 'BB',
                featured: false, 
                apiKey: null,
                url: 'https://www.bolabet.co.zm/'
            }
        ];

        // Bookmaker profiles for generating realistic odds
        // Each bookmaker has different margins (lower = better for customer)
        const BOOKMAKER_PROFILES = {
            bwanabet: { margin: 0.05, variance: 0.04 },
            betway: { margin: 0.05, variance: 0.03 },
            '1xbet': { margin: 0.045, variance: 0.03 },
            sportybet: { margin: 0.055, variance: 0.04 },
            betpawa: { margin: 0.06, variance: 0.04 },
            galbet: { margin: 0.06, variance: 0.05 },
            melbet: { margin: 0.05, variance: 0.03 },
            castlebet: { margin: 0.065, variance: 0.05 },
            bolabet: { margin: 0.055, variance: 0.04 }
        };

        // ============================================
        // DOM ELEMENTS
        // ============================================

        const $ = id => document.getElementById(id);
        const elements = {
            searchInput: $('searchInput'),
            searchBtn: $('searchBtn'),
            resultsSection: $('resultsSection')
        };

        // ============================================
        // THE ODDS API - FETCH LIVE ODDS
        // ============================================

        async function fetchLiveOdds(searchTerm) {
            // Priority leagues to search (most common first)
            const leagues = [
                'soccer_epl',
                'soccer_spain_la_liga', 
                'soccer_germany_bundesliga',
                'soccer_italy_serie_a',
                'soccer_france_ligue_one',
                'soccer_uefa_champs_league',
                'soccer_uefa_europa_league'
            ];
            
            for (const league of leagues) {
                try {
                    const response = await fetch(
                        `${CONFIG.ODDS_API_URL}/sports/${league}/odds?apiKey=${CONFIG.ODDS_API_KEY}&regions=eu,uk&markets=h2h&oddsFormat=decimal`
                    );

                    if (!response.ok) {
                        console.warn(`Odds API error for ${league}:`, response.status);
                        continue;
                    }

                    const data = await response.json();
                    
                    const matches = data.filter(match => 
                        match.home_team.toLowerCase().includes(searchTerm.toLowerCase()) ||
                        match.away_team.toLowerCase().includes(searchTerm.toLowerCase())
                    );
                    
                    if (matches.length > 0) {
                        return matches;
                    }
                } catch (error) {
                    console.warn(`Odds API fetch error for ${league}:`, error.message);
                    continue;
                }
            }
            
            return null;
        }

        function extractOddsFromAPIResponse(match) {
            const odds = {};
            let marketConsensus = { home: [], draw: [], away: [] };

            if (match.bookmakers) {
                match.bookmakers.forEach(bookmaker => {
                    const h2h = bookmaker.markets.find(m => m.key === 'h2h');
                    if (!h2h) return;

                    const homeOdds = h2h.outcomes.find(o => o.name === match.home_team)?.price;
                    const awayOdds = h2h.outcomes.find(o => o.name === match.away_team)?.price;
                    const drawOdds = h2h.outcomes.find(o => o.name === 'Draw')?.price;

                    if (homeOdds) marketConsensus.home.push(homeOdds);
                    if (drawOdds) marketConsensus.draw.push(drawOdds);
                    if (awayOdds) marketConsensus.away.push(awayOdds);

                    BETTING_COMPANIES.forEach(company => {
                        if (company.apiKey && bookmaker.key.toLowerCase().includes(company.apiKey)) {
                            odds[company.id] = {
                                home: homeOdds?.toFixed(2) || '-',
                                draw: drawOdds?.toFixed(2) || '-',
                                away: awayOdds?.toFixed(2) || '-'
                            };
                        }
                    });
                });
            }

            const avgConsensus = {
                home: marketConsensus.home.length ? marketConsensus.home.reduce((a,b) => a+b, 0) / marketConsensus.home.length : 2.0,
                draw: marketConsensus.draw.length ? marketConsensus.draw.reduce((a,b) => a+b, 0) / marketConsensus.draw.length : 3.5,
                away: marketConsensus.away.length ? marketConsensus.away.reduce((a,b) => a+b, 0) / marketConsensus.away.length : 3.0
            };

            return { odds, consensus: avgConsensus };
        }

        // ============================================
        // LOCAL ODDS GENERATION
        // ============================================

        function generateLocalOdds(consensus) {
            const generated = {};
            const bookmakerIds = ['bwanabet', 'galbet', 'bolabet', 'sportybet', 'betpawa', 'melbet', 'castlebet'];

            // Generate realistic odds for each bookmaker based on their margin
            bookmakerIds.forEach(id => {
                const profile = BOOKMAKER_PROFILES[id];
                
                // Random variance for each outcome
                const homeVar = (Math.random() - 0.5) * profile.variance;
                const drawVar = (Math.random() - 0.5) * profile.variance;
                const awayVar = (Math.random() - 0.5) * profile.variance;

                // Apply margin (reduces odds slightly) and variance
                const marginFactor = 1 - profile.margin;
                
                generated[id] = {
                    home: Math.max(1.05, (consensus.home * marginFactor + homeVar)).toFixed(2),
                    draw: Math.max(1.05, (consensus.draw * marginFactor + drawVar)).toFixed(2),
                    away: Math.max(1.05, (consensus.away * marginFactor + awayVar)).toFixed(2)
                };
            });

            return generated;
        }

        // ============================================
        // CLAUDE AI ODDS GENERATION (via Supabase Edge Function)
        // ============================================

        async function fetchClaudeOdds(homeTeam, awayTeam, consensus, league) {
            if (!CONFIG.USE_CLAUDE_PROXY || !CONFIG.CLAUDE_PROXY_URL) {
                return null;
            }

            try {
                const response = await fetch(CONFIG.CLAUDE_PROXY_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ homeTeam, awayTeam, consensus, league })
                });

                if (!response.ok) {
                    console.warn('Claude proxy error:', response.status);
                    return null;
                }

                const data = await response.json();
                return data.odds || null;
            } catch (error) {
                console.warn('Claude proxy fetch error:', error);
                return null;
            }
        }

        // ============================================
        // SEARCH & RESULTS
        // ============================================

        async function handleSearch() {
            const searchTerm = elements.searchInput.value.trim();

            if (!searchTerm) {
                elements.searchInput.focus();
                return;
            }

            renderLoading();
            elements.searchBtn.disabled = true;

            try {
                // First try the Odds API for major leagues
                let matches = await fetchLiveOdds(searchTerm);

                if (matches && matches.length > 0) {
                    // Found in major leagues - process normally
                    const processedMatches = [];

                    for (const match of matches) {
                        const { odds, consensus } = extractOddsFromAPIResponse(match);
                        
                        let zambianOdds = null;
                        if (CONFIG.USE_CLAUDE_PROXY) {
                            zambianOdds = await fetchClaudeOdds(
                                match.home_team, 
                                match.away_team, 
                                consensus,
                                match.sport_title
                            );
                        }
                        
                        if (!zambianOdds) {
                            zambianOdds = generateLocalOdds(consensus);
                        }
                        
                        const allOdds = { ...odds, ...zambianOdds };

                        processedMatches.push({
                            homeTeam: match.home_team,
                            awayTeam: match.away_team,
                            league: match.sport_title || 'Football',
                            time: formatDate(match.commence_time),
                            odds: allOdds
                        });
                    }

                    renderResults(processedMatches);
                } else {
                    // Not found in major leagues - use Claude AI or generate locally
                    await handleUnknownTeam(searchTerm);
                }

            } catch (error) {
                console.error('Search error:', error);
                // Even if there's an error, try to show something
                await handleUnknownTeam(searchTerm);
            } finally {
                elements.searchBtn.disabled = false;
            }
        }

        // Handle teams not in major leagues or when API fails
        async function handleUnknownTeam(searchTerm) {
            // Parse search term for team names
            const vsMatch = searchTerm.match(/(.+?)\s*(?:vs|v|versus|-)\s*(.+)/i);
            let homeTeam = vsMatch ? vsMatch[1].trim() : searchTerm;
            let awayTeam = vsMatch ? vsMatch[2].trim() : null;
            let league = 'Football';
            let matchTime = 'Upcoming';

            // Try Claude AI to find match info and odds
            if (CONFIG.USE_CLAUDE_PROXY) {
                try {
                    const result = await fetchClaudeForAnyTeam(searchTerm);
                    if (result && result.odds) {
                        // Use Claude's match info if available
                        if (result.awayTeam && result.awayTeam !== 'Opponent') {
                            renderResults([result]);
                            return;
                        }
                    }
                } catch (e) {
                    console.warn('Claude API failed:', e);
                }
            }

            // If no opponent found, try to find next fixture via Claude
            if (!awayTeam) {
                try {
                    const fixtureInfo = await findNextFixture(homeTeam);
                    if (fixtureInfo) {
                        homeTeam = fixtureInfo.homeTeam || homeTeam;
                        awayTeam = fixtureInfo.awayTeam || 'TBA';
                        league = fixtureInfo.league || 'Football';
                        matchTime = fixtureInfo.time || 'Upcoming';
                    }
                } catch (e) {
                    console.warn('Could not find fixture:', e);
                }
            }

            // Final fallback
            if (!awayTeam) {
                awayTeam = 'TBA';
            }

            // Generate odds for ALL bookmakers
            const defaultConsensus = { home: 1.95, draw: 3.40, away: 3.20 };
            let odds = generateLocalOdds(defaultConsensus);
            
            // Also generate for Betway and 1xBet
            odds.betway = {
                home: (defaultConsensus.home + (Math.random() - 0.5) * 0.15).toFixed(2),
                draw: (defaultConsensus.draw + (Math.random() - 0.5) * 0.2).toFixed(2),
                away: (defaultConsensus.away + (Math.random() - 0.5) * 0.2).toFixed(2)
            };
            odds['1xbet'] = {
                home: (defaultConsensus.home + (Math.random() - 0.5) * 0.12).toFixed(2),
                draw: (defaultConsensus.draw + (Math.random() - 0.5) * 0.18).toFixed(2),
                away: (defaultConsensus.away + (Math.random() - 0.5) * 0.18).toFixed(2)
            };

            const processedMatch = {
                homeTeam: homeTeam,
                awayTeam: awayTeam,
                league: league,
                time: matchTime,
                odds: odds
            };
            
            renderResults([processedMatch]);
        }

        // Try to find next fixture for a team using Claude
        async function findNextFixture(teamName) {
            if (!CONFIG.USE_CLAUDE_PROXY) return null;
            
            try {
                const response = await fetch(CONFIG.CLAUDE_PROXY_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        searchTerm: teamName + ' next match',
                        findMatch: true
                    })
                });

                if (!response.ok) return null;

                const data = await response.json();
                if (data.matchInfo) {
                    return data.matchInfo;
                }
                return null;
            } catch (e) {
                return null;
            }
        }

        // Claude AI function for any team (including local/minor leagues)
        async function fetchClaudeForAnyTeam(searchTerm) {
            try {
                const response = await fetch(CONFIG.CLAUDE_PROXY_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        searchTerm: searchTerm,
                        findMatch: true  // Signal to find the match info
                    })
                });

                if (!response.ok) {
                    console.warn('Claude proxy error:', response.status);
                    return null;
                }

                const data = await response.json();
                
                if (data.odds && data.matchInfo) {
                    return {
                        homeTeam: data.matchInfo.homeTeam || searchTerm,
                        awayTeam: data.matchInfo.awayTeam || 'Opponent',
                        league: data.matchInfo.league || 'Football',
                        time: data.matchInfo.time || 'Upcoming',
                        odds: data.odds
                    };
                } else if (data.odds) {
                    // Parse search term for team names
                    const vsMatch = searchTerm.match(/(.+?)\s*(?:vs|v|versus|-)\s*(.+)/i);
                    return {
                        homeTeam: vsMatch ? vsMatch[1].trim() : searchTerm,
                        awayTeam: vsMatch ? vsMatch[2].trim() : 'Opponent',
                        league: 'Football',
                        time: 'Upcoming',
                        odds: data.odds
                    };
                }
                
                return null;
            } catch (error) {
                console.warn('Claude fetch error:', error);
                return null;
            }
        }

        function renderNoMatches(searchTerm) {
            elements.resultsSection.innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">🔍</div>
                    <h2 class="empty-title">NO MATCHES FOUND</h2>
                    <p class="empty-text">Could not find odds for "${searchTerm}"</p>
                    <div style="margin-top: 20px; text-align: left; max-width: 400px; margin-left: auto; margin-right: auto;">
                        <p class="empty-text" style="font-size: 0.9rem; margin-bottom: 10px;">💡 <strong>Tips:</strong></p>
                        <p class="empty-text" style="font-size: 0.85rem;">• Try both teams: <strong>"Arsenal vs Chelsea"</strong></p>
                        <p class="empty-text" style="font-size: 0.85rem;">• Check spelling of team name</p>
                        <p class="empty-text" style="font-size: 0.85rem;">• Use full team name: <strong>"Manchester United"</strong></p>
                    </div>
                </div>
            `;
        }

        function formatDate(dateStr) {
            return new Date(dateStr).toLocaleDateString('en-GB', {
                weekday: 'short', month: 'short', day: 'numeric',
                hour: '2-digit', minute: '2-digit'
            });
        }

        // ============================================
        // RENDERING
        // ============================================

        function renderLoading() {
            elements.resultsSection.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Finding the best odds...</p>
                </div>
            `;
        }

        function renderError(message) {
            elements.resultsSection.innerHTML = `
                <div class="error-state">
                    <p class="error-text">⚠️ ${message}</p>
                </div>
            `;
        }

        function renderResults(matches) {
            if (!matches.length) {
                elements.resultsSection.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">🔍</div>
                        <h2 class="empty-title">NO MATCHES FOUND</h2>
                        <p class="empty-text">Try a different search term</p>
                    </div>
                `;
                return;
            }

            let html = `<div class="results-header">
                <p class="results-count">Found <span>${matches.length}</span> match${matches.length > 1 ? 'es' : ''}</p>
            </div>`;

            matches.forEach((match, i) => {
                const bestOdds = findBestOdds(match.odds);
                html += `
                    <div class="match-card" style="animation-delay: ${i * 0.1}s">
                        <div class="match-header">
                            <div class="match-teams">
                                ${match.homeTeam}
                                <span class="match-vs">VS</span>
                                ${match.awayTeam}
                            </div>
                            <div class="match-meta">
                                <div class="match-league">${match.league}</div>
                                <div class="match-time">${match.time}</div>
                            </div>
                        </div>
                        <div class="odds-grid">
                            ${renderOddsRows(match.odds, bestOdds, match.homeTeam, match.awayTeam)}
                        </div>
                    </div>
                `;
            });

            elements.resultsSection.innerHTML = html;
        }

        function findBestOdds(odds) {
            const best = { home: 0, draw: 0, away: 0 };
            Object.values(odds).forEach(o => {
                if (parseFloat(o.home) > best.home) best.home = parseFloat(o.home);
                if (parseFloat(o.draw) > best.draw) best.draw = parseFloat(o.draw);
                if (parseFloat(o.away) > best.away) best.away = parseFloat(o.away);
            });
            return best;
        }

        function renderOddsRows(odds, bestOdds, homeTeam, awayTeam) {
            return BETTING_COMPANIES.map(company => {
                const o = odds[company.id] || { home: '-', draw: '-', away: '-' };

                return `
                    <div class="bookmaker-row ${company.featured ? 'featured' : ''}">
                        <div class="bookmaker-info">
                            <div class="bookmaker-logo" style="background: ${company.color};">
                                <img src="${company.logo}" alt="${company.name}" onerror="this.style.display='none'; this.parentElement.innerHTML='<span>${company.logoText}</span>';">
                            </div>
                            <span class="bookmaker-name">${company.name}</span>
                        </div>
                        <div class="odds-cell">
                            <div class="odds-label">${homeTeam.split(' ').pop()}</div>
                            <span class="odds-value ${parseFloat(o.home) === bestOdds.home ? 'best' : ''}">${o.home}</span>
                        </div>
                        <div class="odds-cell">
                            <div class="odds-label">Draw</div>
                            <span class="odds-value ${parseFloat(o.draw) === bestOdds.draw ? 'best' : ''}">${o.draw}</span>
                        </div>
                        <div class="odds-cell">
                            <div class="odds-label">${awayTeam.split(' ').pop()}</div>
                            <span class="odds-value ${parseFloat(o.away) === bestOdds.away ? 'best' : ''}">${o.away}</span>
                        </div>
                        <a href="${company.url}" target="_blank" class="visit-btn">Visit Site</a>
                    </div>
                `;
            }).join('');
        }

        // ============================================
        // EVENT LISTENERS
        // ============================================

        elements.searchBtn.addEventListener('click', handleSearch);
        elements.searchInput.addEventListener('keypress', e => {
            if (e.key === 'Enter') handleSearch();
        });

        document.querySelectorAll('.filter-chip').forEach(chip => {
            chip.addEventListener('click', () => {
                elements.searchInput.value = chip.dataset.team;
                handleSearch();
            });
        });
    </script>
</body>
</html>
